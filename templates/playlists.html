<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>My Playlists</title>
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      .username {
        color: #4dc4ff;
        font-weight: bold;
      }
      .btn-back {
        background: #ff5e78;
        color: white;
        border: none;
      }
      .btn-back:hover {
        background: #ef0ff7;
        color: white;
      }
      .table td,
      .table th {
        vertical-align: middle;
      }
    </style>
  </head>
  <body class="bg-light p-5">
    <div class="container">
      <!-- Welcome message -->
      <h5 class="mb-2 text-center">Hello!</h5>

      <h2 class="text-center mb-4">My Playlists</h2>
      <form
        action="{{ url_for('create_playlist') }}"
        method="POST"
        class="mb-4 d-flex justify-content-center"
      >
        <input
          type="text"
          name="title"
          class="form-control w-50 me-2"
          placeholder="New Playlist Title"
          required
        />
        <button type="submit" class="btn btn-primary">Create Playlist</button>
      </form>
      <table class="table table-bordered bg-white shadow">
        <thead class="table-light">
          <tr>
            <th>Playlist ID</th>
            <th>Title</th>
            <th>Created On</th>
            <th>Private?</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody>
          {% for pl in playlists %}
          <tr>
            <td>{{ pl.id }}</td>
            <td>{{ pl.title }}</td>
            <td>{{ pl.creation_date }}</td>
            <td>{{ pl.private }}</td>
            <td>
              <a
                href="{{ url_for('playlist_detail', pid=pl.id) }}"
                class="btn btn-primary btn-sm"
              >
                View
              </a>
            </td>
          </tr>
          {% else %}
          <tr>
            <td colspan="4" class="text-center text-muted">
              You have no playlists yet.
            </td>
          </tr>
          {% endfor %}
        </tbody>
      </table>

      <div class="d-flex justify-content-between mt-4">
        <a href="{{ url_for('home') }}" class="btn btn-back">Back to Home</a>
        <!-- <a href="{{ url_for('playlist_index') }}" class="btn btn-back">Refresh Playlists</a> -->
        <a href="/search_user_playlist" class="btn btn-primary">Search for playlists or users</a>
      </div>
    </div>

    <!-- Bootstrap JS bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
