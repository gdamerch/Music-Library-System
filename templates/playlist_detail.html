<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{{ playlist.title }} — My Playlists</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .username { color: #4dc4ff; font-weight: bold; }
    .btn-back { background: #ff5e78; color: white; border: none; }
    .btn-back:hover { background: #ef0ff7; color: white; }
  </style>
</head>
<body class="bg-light p-5">
  <div class="container">
    <h5 class="mb-2 text-center">
      Hello, <span class="username">{{ username }}</span>
    </h5>
    <h2 class="text-center mb-4">{{ playlist.title }}</h2>

    <!-- Songs in the playlist -->
    <table class="table table-bordered bg-white shadow">
      <thead class="table-light">
        <tr>
          <th>Title</th>
          <th>Artist</th>
          <th>Album</th>
          <th>Duration</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody>
        {% for s in songs %}
        <tr>
          <td>{{ s.title }}</td>
          <td>{{ s.artist_name }}</td>
          <td>{{ s.album_name }}</td>
          <td>{{ s.duration }}</td>
          <td>
            <form method="POST" action="{{ url_for('remove_song', pid=playlist.id, sid=s.id) }}">
              <button class="btn btn-danger btn-sm">Remove</button>
            </form>
          </td>
        </tr>
        {% else %}
        <tr><td colspan="5" class="text-center">No songs yet.</td></tr>
        {% endfor %}
      </tbody>
    </table>

    <!-- Add a new song -->
    <h4 class="mt-4">Add a Song</h4>
    <form method="POST" action="{{ url_for('add_song', pid=playlist.id) }}">
      <div class="mb-3">
        <label for="song_id" class="form-label">Choose song:</label>
        <select name="song_id" id="song_id" class="form-select">
          {% for s in all_songs %}
            <option value="{{ s.id }}">{{ s.title }} — {{ s.artist_name }}</option>
          {% endfor %}
        </select>
      </div>
      <button class="btn btn-success">Add</button>
    </form>

    <div class="mt-4">
      <a href="{{ url_for('playlist_index') }}" class="btn btn-back">Back to My Playlists</a>
      <a href="{{ url_for('home') }}" class="btn btn-back">Back Home</a>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
